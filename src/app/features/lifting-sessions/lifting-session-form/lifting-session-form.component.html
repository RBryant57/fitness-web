<div class="page">
  <p class="page-eyebrow">Strength</p>
  <div class="page-header">
    <h1>{{ isEdit ? 'Edit Lifting Session' : 'Log a Lifting Session' }}</h1>
    <div class="page-actions">
      <a class="btn" routerLink="/lifting-sessions">Cancel</a>
    </div>
  </div>
  <app-route-divider></app-route-divider>

  @if (error) {
    <div class="error-banner">{{ error }}</div>
  }

  @if (loading) {
    <div class="loading-row"><span class="spinner"></span> Loading…</div>
  } @else {
    <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <div class="field">
          <label for="date">Date</label>
          <input id="date" type="date" formControlName="Date" />
        </div>
        <div class="field">
          <label for="circuitId">Circuit</label>
          <select id="circuitId" formControlName="CircuitId">
            <option [ngValue]="null">Select a circuit…</option>
            @for (c of circuits; track c.Id) {
              <option [ngValue]="c.Id">{{ c.Name }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="numberOfSets">Number of sets</label>
          <input id="numberOfSets" type="number" min="1" formControlName="NumberOfSets" />
        </div>

        <div class="field field-full">
          <label for="notes">Notes</label>
          <textarea id="notes" formControlName="Notes"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="submitting">
          {{ submitting ? 'Saving…' : 'Save session' }}
        </button>
        <a class="btn" routerLink="/lifting-sessions">Cancel</a>
      </div>
    </form>
  }
</div>
