<div class="page">
  <p class="page-eyebrow">Routes</p>
  <div class="page-header">
    <h1>{{ isEdit ? 'Edit Route' : 'Add a Route' }}</h1>
    <div class="page-actions">
      <a class="btn" routerLink="/routes">Cancel</a>
    </div>
  </div>
  <app-route-divider></app-route-divider>

  @if (error) {
    <div class="error-banner">{{ error }}</div>
  }

  @if (loading) {
    <div class="loading-row"><span class="spinner"></span> Loading…</div>
  } @else {
    <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <div class="field field-full">
          <label for="name">Name</label>
          <input id="name" type="text" formControlName="Name" />
        </div>

        <div class="field">
          <label for="city">City</label>
          <input id="city" type="text" formControlName="City" />
        </div>
        <div class="field">
          <label for="state">State</label>
          <input id="state" type="text" formControlName="State" />
        </div>

        <div class="field">
          <label for="typeId">Route type</label>
          <select id="typeId" formControlName="TypeId">
            <option [ngValue]="null">Select a type…</option>
            @for (t of routeTypes; track t.Id) {
              <option [ngValue]="t.Id">{{ t.Name }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label for="rating">Rating (1–5)</label>
          <input id="rating" type="number" min="1" max="5" formControlName="Rating" />
        </div>

        <div class="field field-full">
          <label for="notes">Notes</label>
          <textarea id="notes" formControlName="Notes"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="submitting">
          {{ submitting ? 'Saving…' : 'Save route' }}
        </button>
        <a class="btn" routerLink="/routes">Cancel</a>
      </div>
    </form>
  }
</div>
